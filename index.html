<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lista spesa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#10966b">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#22c58b,#0b7a62);font-family:system-ui,sans-serif;color:#fff;text-align:center}
  img{width:96px;height:96px}
  a{display:inline-block;margin-top:20px;padding:14px 24px;border-radius:14px;background:#fff;color:#0b7a62;font-weight:600;text-decoration:none}
  p{opacity:.85}
</style>
</head>
<body>
<main>
  <img src="icon-192.png" alt="">
  <h1>Lista della spesa</h1>
  <p id="msg">Per installarla: menu ⋮ di Chrome → Installa app.</p>
  <a id="go" href="https://claude.ai/artifact/77LxmVGZA5JKEzUAuEJXtL">Apri la lista</a>
</main>
<script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});
  // Aperta dall'icona sulla schermata Home: va subito alla lista su Claude.
  // Aperta nel browser: resta qui, così puoi installarla.
  if (matchMedia("(display-mode: standalone)").matches || navigator.standalone) {
    document.getElementById("msg").textContent = "Apertura in corso…";
    setTimeout(function(){ location.href = document.getElementById("go").href; }, 300);
  }
</script>
</body>
</html>
